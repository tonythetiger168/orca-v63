#=============================================================================
# ORCA v6.3 ZEN++ Coverage Hierarchy Configuration
# File: coverage.cfg
# Description: Controls VCS/Verdi coverage collection scope
#=============================================================================

# Include all modules in coverage
+tree orca_v63_soc

# Exclude testbench components from code coverage
-module orca_uvm_pkg
-module uvm_pkg
-module tb_top
# v6.3.3: directed TB (Verilator 用) 與 UVM 介面不計入 RTL 覆蓋率
-module cpu_directed_tb
-module orca_cpu_if

# Exclude primitive libraries
-module sram_1r1w
-module sram_2r1w
-module flop_array
-module clock_gate

# Exclude PHY stubs (not real logic)
-module npu_hbm3_phy
-module pcie_gen6

# Focus coverage on critical modules
+assert orca_v63_cpu_core
+assert cmt_rob
+assert exu_alu
+assert ifu_bpu
+assert npu_systolic
+assert npu_pe
+assert orca_noc_router

# Toggle coverage for all data paths
+toggle orca_v63_cpu_core
+toggle orca_v63_ai_tile

# FSM coverage for state machines
+fsm ifu_bpu
+fsm npu_gscu
+fsm orca_noc_router
